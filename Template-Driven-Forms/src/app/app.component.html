<section class="container" [ngClass]="{'form-shadow':registerForm.touched}">
  <header>Registration Form</header>

  <form class="form" (ngSubmit)="FormSubmitted()" #registerForm="ngForm">
    <div class="column">
      <div class="input-box">
        <input type="text" placeholder="First Name" name="firstName" [(ngModel)]="firstName" #firstname="ngModel" required/>
        <span *ngIf="firstname.invalid && firstname.touched">*First name is a required field</span>
        <small *ngIf="firstName">You have Entered:{{firstName}}</small>
      </div> 

      <div class="input-box">
        <input type="text" placeholder="Last Name" name="lastName"ngModel required #lname="ngModel"/>
        <span *ngIf="lname.invalid && lname.touched">*last name is a required field</span>
      </div>
    </div>    

    <div class="input-box">
      <input type="text" placeholder="Email" name="email" ngModel required email #email="ngModel"/>
      <span *ngIf="email.invalid && email.touched">*email is a required field</span>
    </div>

    <div class="column">
      <div class="input-box">
        <input type="number" placeholder="Phone Number"name="phone" ngModel/>
      </div>
      <div class="input-box">
        <input type="date" placeholder="Date of Birth"name="DOB" [(ngModel)]="dob" #tempdob="ngModel"/>
      </div>
    </div>

    <div class="input-box">
      <input type="text" placeholder="username" name="username" #uname="ngModel" ngModel required />
      <div>
        <span *ngIf="uname.invalid && uname.touched">*userName is a required field</span>
      </div>
      <button class="btn-gen-username" [disabled]="firstname.invalid || lname.invalid || tempdob.invalid"
      (click)="generateUsername()" type="button">
        Create a Username
      </button>
    </div>

    <div class="gender-box">
      <h3>Gender</h3>
      <div class="gender-option">
        <div class="gender">
          <input type="radio" id="check-male" name="gender" checked ngModel/>
          <label for="check-male">male</label>
        </div>
        <div class="gender">
          <input type="radio" id="check-female" name="gender" ngModel/>
          <label for="check-female">Female</label>
        </div>
        <div class="gender">
          <input type="radio" id="check-other" name="gender" ngModel/>
          <label for="check-other">prefer not to say</label>
        </div>
      </div>
    </div>

    <div class="input-box address" ngModelGroup="address" #add="ngModelGroup">
      <label>Address</label>
      <input type="text" placeholder="Street address" name="add1"ngModel required/>
      <input type="text" placeholder="Street address line 2" name="add2"ngModel/>
      <div class="column">
        <div class="select-box">
          <select name="country" placeholder='India' ngModel required>
            <option hidden>Country</option>
            <option>America</option>
            <option>Japan</option>
            <option>India</option>
            <option>Nepal</option>
          </select>
        </div>
        <input type="text" placeholder="City" name="city"ngModel required/>
      </div>
      <div class="column">
        <input type="text" placeholder="Region" name="region"ngModel/>
        <input type="number" placeholder="Postal code" name="postal"ngModel required/>
      </div>
      <small *ngIf="add.invalid && add.touched">*some of the address field is required</small>
    </div>
    <input type="submit" value="Submit" class="submit-btn" [disabled]="registerForm.invalid"> 
  </form>
</section>
